<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký — Film4U</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/Dangnhap.css">
</head>
<body class="bg-gradient">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg auth-card p-4">
      <h3 class="text-center mb-3"><i class="fa-solid fa-user-plus"></i> Đăng ký mới</h3>
      <form id="registerForm" novalidate>
        <!-- Tên đăng nhập -->
        <div class="mb-3">
          <label class="form-label">Tên đăng nhập</label>
          <input type="text" id="regName" class="form-control" placeholder="vd: vantiet2906" required>
        </div>

        <!-- Mật khẩu -->
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <input type="password" id="regPass" class="form-control" placeholder="Mật khẩu mạnh" required>
            <button class="btn btn-outline-secondary" type="button" id="toggleRegPass" title="Hiện/ẩn mật khẩu">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="form-text">Mật khẩu phải có ít nhất 6 ký tự, bao gồm chữ hoa, chữ thường và ký tự đặc biệt *</div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="mb-3">
          <label class="form-label">Xác nhận mật khẩu</label>
          <div class="input-group">
            <input type="password" id="regPassConfirm" class="form-control" placeholder="Nhập lại mật khẩu" required>
            <button class="btn btn-outline-secondary" type="button" id="toggleRegPassConfirm" title="Hiện/ẩn mật khẩu">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Mật khẩu xác nhận không khớp!</div>
        </div>

        <!-- Nút đăng ký -->
        <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-user-check"></i> Đăng ký</button>
      </form>

      <p class="text-center mt-3 small">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/DangNhap.js"></script>
</body>
</html>
