<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — Film4U</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/Dangnhap.css">
</head>
<body class="bg-gradient">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg auth-card p-4">
      <h3 class="text-center mb-3"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</h3>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Tên đăng nhập</label>
          <input type="text" id="loginName" class="form-control" placeholder="vd: vantiet2906" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <input type="password" id="loginPass" class="form-control" placeholder="Mật khẩu" required>
            <button class="btn btn-outline-secondary" type="button" id="toggleLoginPass" title="Hiện/ẩn mật khẩu">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-key"></i> Đăng nhập</button>
      </form>
      <p class="text-center mt-3 small">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/DangNhap.js"></script>
</body>
</html>
