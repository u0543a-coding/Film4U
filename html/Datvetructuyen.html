<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/datve.css" />
  <title>Đặt vé phim</title>
</head>
<body>
  <div class="datve-container">
    <h2 class="datve-title">Đặt Vé Trực Tuyến</h2>

    <!-- Chọn rạp (value = cinema id) -->
    <select class="datve-cinema-select">
      <option value="">-- Chọn rạp --</option>
      <option value="1">Film4U Gò Vấp</option>
      <option value="2">Film4U Quận 7</option>
      <option value="4">Film4U Cầu Giấy</option>
    </select>

    <!-- Nơi JS sẽ render các movie cards -->
    <div class="datve-movie-box"></div>

    <!-- Ngày chiếu (dùng tĩnh, không can thiệp JS ở đây) -->
    <div class="datve-date-list">
      <div class="datve-date-item active">13/10<br><small>Th2</small></div>
      <div class="datve-date-item">14/10<br><small>Th3</small></div>
      <div class="datve-date-item">15/10<br><small>Th4</small></div>
      <div class="datve-date-item">16/10<br><small>Th5</small></div>
      <div class="datve-date-item">17/10<br><small>Th6</small></div>
      <div class="datve-date-item">18/10<br><small>Th7</small></div>
    </div>
  </div>

  <!-- script nên đặt cuối body -->
  <script src="../js/DatVe.js"></script>
</body>
</html>
