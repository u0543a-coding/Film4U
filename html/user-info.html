<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin tài khoản - Film4U</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/login.css"> <!-- Tái sử dụng một số style từ trang login -->
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="main-container">
        <div class="form-container" id="user-info-container">
            <h1>Thông tin tài khoản</h1>
            <div class="info-group">
                <label>Họ và tên:</label>
                <p id="user-fullname"></p>
            </div>
            <div class="info-group">
                <label>Email:</label>
                <p id="user-email"></p>
            </div>
            <div class="info-group">
                <label>Số điện thoại:</label>
                <p id="user-phone"></p>
            </div>
            <button id="logout-button" class="submit-btn">Đăng xuất</button>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="../js/layout.js"></script>
    <script src="../js/user-info.js"></script>
</body>
</html>
