<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/homepage.css">
  <link rel="stylesheet" href="../css/cinemabooking.css">
  <title>Đặt vé phim</title>
</head>

<body class="body">
  <!-- header -->
  <div id="header-placeholder"></div>
  <!-- !header -->

  <!-- body -->
  <div class="datve-container">
    <h2 class="datve-title">Đặt Vé Trực Tuyến</h2>

    <!-- Chọn rạp -->
    <select class="datve-cinema-select">
      <option selected>Đang tải rạp...</option>
    </select>

    <!-- Ngày chiếu (JS sẽ điền vào đây) -->
    <div class="datve-date-list">
      <p>Đang tải ngày...</p>
    </div>

    <!-- Thông tin rạp (JS sẽ điền vào đây) -->
    <div class="datve-cinema-info">
      <p>Vui lòng chọn rạp và ngày xem...</p>
    </div>

    <!-- Thông tin phim (JS sẽ điền vào đây) -->
    <div class="datve-movie-box">
        <p>Đang tải thông tin phim và suất chiếu...</p>
    </div>

  </div>
  <!-- !!body -->

  <!-- footer -->
  <div id="footer-placeholder"></div>
  <!-- !footer -->

  <script src="../js/api.js"></script>
  <script src="../js/cinemabooking.js"></script>
  <script src="../js/layout.js"></script>
</body>

</html>
