<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — Film4U</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

  <div class="card shadow-lg p-4" style="width: 400px;">
    <h3 class="text-center mb-4 text-primary">Đăng ký tài khoản</h3>

    <form id="register-form">
      <div class="mb-3">
        <label for="fullName" class="form-label">Họ và tên</label>
        <input type="text" id="fullName" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Mật khẩu</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
        <div class="input-group">
          <input type="password" id="confirmPassword" class="form-control" required>
          <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Đăng ký</button>

      <p id="error-message" class="text-danger text-center mt-3"></p>
      <p class="text-center mt-2">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/registerUser.js"></script>
</body>
</html>
