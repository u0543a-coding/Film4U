<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin — Film4U</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color:#f7f7f7; font-family: Arial, sans-serif; }
    .login-container { max-width:400px; margin:80px auto; padding:30px; background:#fff; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.2);}
    .toggle-pass { cursor:pointer; }
    #alertMsg { display:none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h3 class="text-center mb-4">Đăng nhập Admin</h3>
    <div id="alertMsg" class="alert text-center"></div>
    <form id="adminLoginForm">
      <div class="mb-3">
        <label for="adminEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="adminEmail" required>
      </div>
      <div class="mb-3">
        <label for="adminPassword" class="form-label">Mật khẩu</label>
        <div class="input-group">
          <input type="password" class="form-control" id="adminPassword" required>
          <span class="input-group-text toggle-pass" id="toggleAdminPass">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/adminDN.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
